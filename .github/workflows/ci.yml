name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Run architecture checks
        run: ./scripts/check_architecture.sh

      - name: Run coverage gate
        run: ./scripts/check_coverage.sh

      - name: Build release bundle inputs
        run: |
          xcodebuild \
            -scheme AlertCalendar \
            -configuration Release \
            -destination "platform=macOS" \
            build
